apiVersion: apps/v1
kind: Deployment
metadata:
  name: gen-ai-java-spring
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gen-ai-java-spring
  template:
    metadata:
      labels:
        app: gen-ai-java-spring
    spec:
      containers:
        - name: app
          image: <YOUR_REGISTRY>/gen-ai-java-spring:latest
          env:
            - name: LOKI_URL
              value: "http://loki.loki.svc.cluster.local:3100/loki/api/v1/push"
            - name: SPRING_PROFILES_ACTIVE
              value: "prod"
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: gen-ai-java-spring
  namespace: default
spec:
  selector:
    app: gen-ai-java-spring
  ports:
    - port: 8081
      targetPort: 8081
      protocol: TCP
      name: http
  type: ClusterIP
